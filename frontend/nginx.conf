server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /projects/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /reports/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /account/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /papers/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
